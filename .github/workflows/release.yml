name: "Publish"

on:
  push:
    branches:
      - "launcher"
    paths-ignore:
      - "README.md"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    permissions: write-all
    runs-on: ${{ matrix.os }}
    env:
      # Baked into the build (build.gradle.kts), must match the release tag "v<run_number>" created below
      RELEASE_NUMBER: ${{ github.run_number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          java-package: jdk
          cache: gradle

      - name: Install packaging tools (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Gradle Build Packages & Staging
        run: |
          mkdir -p build/upload-ready
          
          if [ "$RUNNER_OS" == "Windows" ]; then
            ./gradlew packageMsi
            cp build/dist/msi/*.msi build/upload-ready/ || true
          
            ./gradlew packageExe
            cp build/dist/exe/*.exe build/upload-ready/ || true
          
            ./gradlew zipPackage
            cp build/dist/zip/*.zip build/upload-ready/ || true
          
          elif [ "$RUNNER_OS" == "Linux" ]; then
            ./gradlew packageDeb
            cp build/dist/deb/*.deb build/upload-ready/ || true
          
            ./gradlew packageRpm
            cp build/dist/rpm/*.rpm build/upload-ready/ || true
          
            ./gradlew zipPackage
            cp build/dist/zip/*.zip build/upload-ready/ || true
          
          elif [ "$RUNNER_OS" == "macOS" ]; then
            ./gradlew packageDmg
            cp build/dist/dmg/*.dmg build/upload-ready/ || true
          
            ./gradlew packagePkg
            cp build/dist/pkg/*.pkg build/upload-ready/ || true
          
            ./gradlew zipPackage
            cp build/dist/zip/*.zip build/upload-ready/ || true
          fi

          # Génération des Checksums uniquement pour les fichiers finaux
          cd build/upload-ready
          for file in *; do
            if [ -f "$file" ]; then
              if command -v sha256sum &> /dev/null; then
                sha256sum "$file" > "$file.sha256"
              else
                shasum -a 256 "$file" > "$file.sha256"
              fi
            fi
          done
        shell: bash

      - name: Archive build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-${{ matrix.os }}
          path: build/upload-ready/*

  release:
    permissions: write-all
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history and tags, needed to list the commits since the previous release
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: all-artifacts

      - name: Prepare Release Files
        run: |
          mkdir -p release-dist
          # On copie tout bêtement le contenu des dossiers téléchargés
          # Plus besoin de filtrer agressivement, la CI a déjà fait le tri !
          find all-artifacts -type f -exec cp {} release-dist/ \;

      - name: Generate release notes
        run: python3 scripts/release_notes.py > release-notes.md

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ github.run_number }}" release-dist/* \
            --title "Release v${{ github.run_number }}" \
            --notes-file release-notes.md \
            --target "${{ github.sha }}"

